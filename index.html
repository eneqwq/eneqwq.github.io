*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}

.hero{position:relative;aspect-ratio:4/5;background:#222 var(--hero) center/cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#000 0%,rgba(0,0,0,.55) 30%,transparent 60%)}

.info{position:absolute;left:0;right:0;bottom:18px;z-index:2;text-align:center}
.info h1{margin:0;font-size:30px}

.icons{display:flex;justify-content:center;gap:12px}
.icons a{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.icons svg{width:22px;height:22px;fill:#fff}
.i-x{background:#111;border:1px solid #333}

.card{display:flex;align-items:center;gap:14px;padding:12px;margin:12px 0;border-radius:24px;color:#fff;text-decoration:none;font-weight:700;font-size:17px;border:1px solid rgba(255,255,255,.14)}
.rd{background:radial-gradient(circle at 15% 20%,rgba(255,120,70,.75),transparent 55%),radial-gradient(circle at 85% 80%,rgba(255,69,0,.45),transparent 55%),#3a1a10}

.card .th{width:56px;height:56px;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.card .th svg{width:34px;height:34px}
.rd .th svg{fill:#ff4500}
.tg .th svg{fill:#229ed9}
.card span{flex:1;text-align:center;padding-right:56px}
h2{font-size:17px;margin:28px 0 12px}
.mail{display:flex;align-items:center;gap:12px;padding:16px 18px;border-radius:999px;background:#111;border:1px solid #2a2a2a;color:#fff;text-decoration:none;font-size:17px}
.mail svg{width:22px;height:22px;flex:none}
